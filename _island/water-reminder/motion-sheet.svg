<rect x="55" y="405" width="1490" height="1" fill="#cbd0dc"/><text x="57" y="455" font-family="Arial" font-size="19" font-weight="700" fill="#17233b">TIMING / INTERACTION</text>
<g font-family="Arial" font-size="15" fill="#49546a"><text x="60" y="502">0.0–0.3s</text><text x="210" y="502">Tiny capsule pulse, web line peeks up from the island.</text><text x="60" y="542">0.3–0.9s</text><text x="210" y="542">Character rises with a soft overshoot and lands beside the pill.</text><text x="60" y="582">0.9–2.5s</text><text x="210" y="582">Friendly wave and short spoken nudge: “Water break?”</text><text x="60" y="622">2.5s onward</text><text x="210" y="622">Glass offer stays tappable; snooze remains available.</text><text x="60" y="662">On confirm</text><text x="210" y="662">Sip beat → web shoots into capsule → character swings out → pill contracts.</text></g>
