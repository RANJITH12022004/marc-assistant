<g transform="translate(1100 220) scale(.7)"><use href="#sp"/><path d="M36 8L59-10L72 20L49 30Z" fill="#b7edff" stroke="#2789ce" stroke-width="2.5"/><path d="M30 2q16-13 28-1" fill="none" stroke="#38b7e9" stroke-width="2.5"/></g><text x="1100" y="322">06 · SIP</text><text x="1100" y="346" font-size="13">after “I drank”</text>
