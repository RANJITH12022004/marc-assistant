<rect width="1600" height="900" rx="32" fill="url(#bg)"/><text x="55" y="67" font-family="Arial" font-size="30" font-weight="700" fill="#17233b">WATER BREAK · MOTION TIMING SHEET</text><text x="56" y="101" font-family="Arial" font-size="16" fill="#697286">A short, friendly interruption built around the island capsule · timings are starting points</text>
<g font-family="Arial" fill="#344057"><g font-size="16" text-anchor="middle">
<g transform="translate(125 220) scale(.7)"><rect x="-55" y="-25" width="110" height="24" rx="12" fill="#08090c"/><use href="#sp" transform="translate(0 0) scale(.52)"/></g><text x="125" y="322">01 · IDLE</text><text x="125" y="346" font-size="13">quiet pill</text>
