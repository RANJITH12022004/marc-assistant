<rect x="54" y="443" width="1392" height="1" fill="#cbd0dc"/><text x="55" y="490" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#17233b">COSTUME NOTES</text><text x="55" y="526" font-family="Arial,sans-serif" font-size="16" fill="#485268">Crimson web-marked mask and torso · deep blue limbs · bright expressive lenses · compact readable shapes for a tiny pill-sized stage.</text><text x="55" y="575" font-family="Arial,sans-serif" font-size="15" fill="#6f7787">Keep the head and hand gesture inside the capsule bounds during the pop-up; allow the web line to extend beyond the pill during the exit.</text>
